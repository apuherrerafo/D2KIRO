name: release-gate

# Compuerta propia de release/mvp-beta (lo que Railway Preview publica): `independent-review` COMPRUEBA las revisiones contra git
# (scripts/ci/verify-review-evidence.ts); ya no basta con declarar dos nombres en la descripción del PR.
#
# `pull_request_target` (no `pull_request`) A PROPOSITO: el workflow y el script que decide el veredicto se leen de la rama BASE protegida, no del PR.
# Con `pull_request` un PR podia reescribir el verificador para terminar en `exit 0`. Reglas de seguridad de este trigger:
#   - NUNCA se hace checkout del codigo del PR: solo se traen sus objetos con `git fetch` y el verificador LEE blobs (`git show`/`git diff`), no ejecuta nada;
#   - el numero de PR y los SHA entran por `env` (datos), jamas interpolados en el script.
on:
  pull_request_target:
    branches: [release/mvp-beta]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  independent-review:
    name: independent-review
    runs-on: ubuntu-24.04
    steps:
      # Sin `ref:` => rama base (el valor por defecto de pull_request_target). Historia completa para poder calcular merge-base y diffs.
      - name: Checkout the protected base branch (never the PR head)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (fijado por SHA: este job decide el veredicto de una rama protegida)
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the PR objects (no checkout, nothing is executed)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 (fijado por SHA)

      - name: Review evidence is real, bound to this exact diff, current and from 2+ providers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun run scripts/ci/verify-review-evidence.ts "$BASE_SHA" "$HEAD_SHA"
